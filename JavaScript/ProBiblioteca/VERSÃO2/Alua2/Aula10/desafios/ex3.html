<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo menu de Opções</title>
</head>
<body>
    Opção (1-3): <input type="number" id="opcaoEscolhida" min="1" max="3" value="2"><br><br>
    <Button onclick="executarOpcao()">Executar Opcão</Button>

    <script>
        function executarOpcao () {
            let opcao = parseInt(document.getElementById("opcaoEscolhida").value);
            let mensagem;
            switch (opcao) {
                case 1:
                    mensagem = "Imprimindo...";
                    break;
                case 2:
                    mensagem = "Salvando...";
                    break;
                case 3:
                    mensagem = "Excluindo...";
                    break;
                default:
                    mensagem = "Opção inválida!"; {
            }
        }
        document.getElementById("resultadoOpcao").innerHTML = `Ação <strong>${mensagem}</strong>`;
        }
    </script>
</body>
</html>
