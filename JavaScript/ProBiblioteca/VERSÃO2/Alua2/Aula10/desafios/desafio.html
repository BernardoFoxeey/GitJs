<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Dinheiro (1-3): <input type="number" id="converter" min="1" max="3" value="2"><br><br>    
    Digite um valor: <input type="text" id="valorTexto"><br><br>    
    <button onclick="converterMoeda()">Converter</button><br><br>
    <div id="resultadoConversao"></div><br><br>
    <script>
        function converterMoeda() {
            let tipoConversao = parseInt(document.getElementById("converter").value); // Tipo de conversão (1-3)
            let valorTexto = parseFloat(document.getElementById("valorTexto").value); // Valor digitado na caixa de texto
            let resultado;

            if (isNaN(valorTexto)) {
                resultado = "Por favor, insira um valor válido!";
            } else {
                switch (tipoConversao) {
                    case 1:
                        resultado = valorTexto * 5.25; // Conversão para reais
                        break;
                    case 2:
                        resultado = valorTexto * 0.15; // Conversão para euros
                        break;
                    case 3:
                        resultado = valorTexto * 0.17; // Conversão para dólares
                        break;
                    default:
                        resultado = "Tipo de conversão inválido!";
                        break;
                }
            }

            document.getElementById("resultadoConversao").innerHTML = `O valor convertido é: <strong>${resultado}</strong>`;
        }
    </script>

</body>
</html>
