<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categoria de Filme</title>
</head>
<body>
    Classificação do Filme (1-5): <input type="number" id="classificacao" value="14"><br><br>
    <button onclick="exibirCategoria()">Exibir Categoria</button><br><br>
    <div id="resultadoCategoria"></div>

    <script>
        function exibirCategoria() {
            let idade = document.getElementById("classificacao").value;
            let categoria;
            switch (idade) {
                case "Livre":
                    categoria = "Livre para todos as idades";
                    break;
                case "10":
                case "12":    
                    categoria = "Recomendado para maiores de 10 anos";
                    break;
                case "14":
                    categoria = "Recomendado para maiores de 14 anos";
                    break;
                case "16":
                    categoria = "Recomendado para maiores de 16 anos";
                    break;
                case "18":
                    categoria = "Recomendado para maiores de 18 anos";
                    break;
                default:
                    categoria = "Classificação inválida!";
        }
            document.getElementById("resultadoCategoria").innerHTML = `A classificação ${idade} é: <strong>${categoria}</strong>`;
        }
    </script>
</body>
</html>
