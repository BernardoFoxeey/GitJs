<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Estação do Ano</title>
</head>
<body>
  <h1>Descubra a estação do ano</h1>
  <label for="mes">Digite um número de 1 a 12:</label>
  <input type="number" id="mes" min="1" max="12">
  <button onclick="mostrarEstacao()">Ver Estação</button>
  <p id="resultado"></p>

  <script>
    function mostrarEstacao() {
      const mes = parseInt(document.getElementById('mes').value);
      let estacao;

      switch (mes) {
        case 12:
        case 1:
        case 2:
          estacao = 'Verão';
          break;
        case 3:
        case 4:
        case 5:
          estacao = 'Outono';
          break;
        case 6:
        case 7:
        case 8:
          estacao = 'Inverno';
          break;
        case 9:
        case 10:
        case 11:
          estacao = 'Primavera';
          break;
        default:
          estacao = 'Número inválido. Digite um valor entre 1 e 12.';
      }

      document.getElementById('resultado').innerText = estacao;
    }
  </script>
</body>
</html>
